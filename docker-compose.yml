services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ins
      MYSQL_USER: ig_usertagram_saas
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Optional hardening: uncomment, set REDIS_PASSWORD in .env and use
    # REDIS_URL=redis://:<password>@redis:6379/0
    # command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
    expose: ["8000"]   # not published: only nginx (frontend) and n8n reach it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Serves the React app and proxies /api/* to the backend (same origin, so no CORS issues)
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ["80:80"]   # terminate TLS in front of this (Caddy / Traefik / nginx / cloud LB) in production

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Bound to localhost on purpose: the n8n editor must NOT be public without authentication.
    # Reach it through an SSH tunnel or a reverse proxy with auth. The backend talks to it
    # over the internal Docker network (N8N_WEBHOOK_URL=http://n8n:5678/webhook/...).
    ports: ["127.0.0.1:5678:5678"]
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678/}
      - BACKEND_URL=http://backend:8000
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes: [n8n_data:/home/node/.n8n]
    depends_on: [backend]

volumes:
  mysql_data:
  redis_data:
  n8n_data:
